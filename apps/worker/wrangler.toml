name = "workstation-me"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发时，前端在 5173，后端在 8787
[vars]
ENVIRONMENT = "development"
WEATHER_LAT = "39.9042"
WEATHER_LON = "116.4074"
WEATHER_LABEL = "北京"

# 密钥不要写在这里（会被提交进版本库）。
# 部署时用：npx wrangler secret put DEEPSEEK_API_KEY
# 本地开发用 .dev.vars（已在 .gitignore 中排除）

[[d1_databases]]
binding = "DB"
database_name = "workstation-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# P2 才启用 R2 备份
# [[r2_buckets]]
# binding = "BACKUP"
# bucket_name = "workstation-backup"
