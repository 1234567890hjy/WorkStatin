name = "workstation-me"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ---- 静态资源（前端构建产物）----
# 用 Workers 直接托管前端，而不是 Pages：
# 一次部署、前后端天然同源，前端相对路径 /api 才能直接工作。
# SPA 路由：找不到静态文件时回退到 index.html，由前端 React Router 接管。
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 本地开发时，前端在 5173，后端在 8787
[vars]
ENVIRONMENT = "production"
WEATHER_LAT = "39.9042"
WEATHER_LON = "116.4074"
WEATHER_LABEL = "北京"

# 密钥不要写在这里（会被提交进版本库）。
# 部署时用：npx wrangler secret put DEEPSEEK_API_KEY
# 本地开发用 .dev.vars（已在 .gitignore 中排除）

[[d1_databases]]
binding = "DB"
database_name = "workstation-db"
database_id = "ea9195ab-89c4-4511-b443-411c8d83a081"
migrations_dir = "migrations"

# P2 才启用 R2 备份
# [[r2_buckets]]
# binding = "BACKUP"
# bucket_name = "workstation-backup"
