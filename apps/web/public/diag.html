<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网络诊断</title>
<style>
  body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:760px;margin:0 auto;padding:20px;background:#f8fafc;color:#0f172a}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:#64748b;font-size:13px;margin-bottom:18px}
  .row{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .name{font-weight:600;font-size:14px;margin-bottom:4px}
  .res{font-size:13px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
  .ok{color:#059669}
  .fail{color:#dc2626}
  .wait{color:#94a3b8}
  button{margin-top:8px;background:#0f172a;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
  #env{font-size:12px;color:#64748b;line-height:1.7;margin-top:16px;padding:12px;background:#fff;border-radius:10px}
</style>
</head>
<body>
<h1>网络诊断</h1>
<p class="sub">在打不开工作台的设备上打开这个页面，把结果告诉我。</p>

<div id="out"></div>

<div id="env"></div>

<script>
const tests = [
  { name: '1. 直接访问本站首页', url: 'https://yyyhdd.eu.cc/', type: 'text' },
  { name: '2. 本站 API 健康检查', url: 'https://yyyhdd.eu.cc/api/health', type: 'json' },
  { name: '3. 本站 manifest', url: 'https://yyyhdd.eu.cc/manifest.webmanifest', type: 'json' },
  { name: '4. Service Worker 文件', url: 'https://yyyhdd.eu.cc/sw.js', type: 'text' },
  { name: '5. 对照：Cloudflare 官网', url: 'https://www.cloudflare.com/cdn-cgi/trace', type: 'text' },
  { name: '6. 对照：workers.dev 域名', url: 'https://workstation-me.workstation-me.workers.dev/api/health', type: 'json' },
];

const out = document.getElementById('out');

for (const t of tests) {
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `<div class="name">${t.name}</div><div class="res wait">测试中…</div>`;
  out.appendChild(div);
  const res = div.querySelector('.res');

  const started = performance.now();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);

  fetch(t.url, { signal: ctrl.signal, cache: 'no-store' })
    .then(async (r) => {
      clearTimeout(timer);
      const ms = Math.round(performance.now() - started);
      const body = await r.text();
      let extra = '';
      if (t.type === 'json') {
        try { extra = ' ' + JSON.stringify(JSON.parse(body)).slice(0, 120); } catch { extra = ' (非 JSON)'; }
      }
      res.className = 'res ok';
      res.textContent = `✅ HTTP ${r.status} · ${ms}ms${extra}`;
    })
    .catch((e) => {
      clearTimeout(timer);
      const ms = Math.round(performance.now() - started);
      res.className = 'res fail';
      res.textContent = `❌ ${e.name === 'AbortError' ? '超时' : '失败'} · ${ms}ms · ${e.message}`;
    });
}

// 环境信息
const ua = navigator.userAgent;
const conn = navigator.connection || {};
document.getElementById('env').innerHTML = `
<b>环境信息</b><br>
UA：${ua}<br>
在线状态：${navigator.onLine ? '在线' : '离线'}<br>
网络类型：${conn.effectiveType || '未知'} / 下行 ${conn.downlink || '?'}Mbps<br>
安全上下文：${window.isSecureContext ? '是（HTTPS）' : '否'}<br>
Service Worker 支持：${'serviceWorker' in navigator ? '支持' : '不支持'}<br>
已注册 SW：${'serviceWorker' in navigator && navigator.serviceWorker.controller ? '是' : '否'}<br>
剪贴板 API：${navigator.clipboard && navigator.clipboard.readText ? '支持' : '不支持'}
`;
</script>
</body>
</html>
